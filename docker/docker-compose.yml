name: rishav-lab2
services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: devops-lab2-app:2.0.0
    ports:
      - "127.0.0.1:5002:5000"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - lab2
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - visits:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - lab2
volumes:
  visits:
networks:
  lab2:
    driver: bridge
